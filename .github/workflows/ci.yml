name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Directory.Build.props turns warnings into errors when CI=true.
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ContainerForest.slnx

      - name: Build
        run: dotnet build ContainerForest.slnx --no-restore

      # The build regenerates the OpenAPI document; the committed copy must match it.
      - name: Check committed OpenAPI document
        run: |
          if ! git diff --exit-code -- src/Aggregator/Api/openapi; then
            echo "::error::src/Aggregator/Api/openapi is out of date. Build src/Aggregator/Api and commit the JSON."
            exit 1
          fi

      # The CLI's client is generated from that document by Kiota (ADR-0008); the committed copy must match it.
      - name: Check generated CLI client
        run: |
          dotnet tool restore
          scripts/generate-cli-client.sh
          if [ -n "$(git status --porcelain -- src/Cli/Api/Generated)" ]; then
            git status --short -- src/Cli/Api/Generated
            echo "::error::src/Cli/Api/Generated is out of date. Run scripts/generate-cli-client.sh and commit it."
            exit 1
          fi

      # The SOPS tests run the real sops and age-keygen; with CF_TEST_REQUIRE_SOPS they fail instead of skipping.
      - name: Install sops and age-keygen
        run: |
          scripts/install-sops.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The signature tests run the real ssh-keygen, which ubuntu-latest has; with CF_TEST_REQUIRE_SSH_KEYGEN they fail instead of skipping.
      - name: Test
        run: dotnet test --solution ContainerForest.slnx --no-build
        env:
          CF_TEST_REQUIRE_SOPS: 1
          CF_TEST_REQUIRE_SSH_KEYGEN: 1

  web:
    name: Build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: src/Web/.nvmrc
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Install
        run: npm ci

      # The API types come from the committed OpenAPI document; the committed copy must match it.
      - name: Check generated API types
        run: |
          npm run generate:api
          if ! git diff --exit-code -- src/api/schema.gen.ts; then
            echo "::error::src/Web/src/api/schema.gen.ts is out of date. Run npm run generate:api and commit it."
            exit 1
          fi

      # typecheck + vite build; the build also regenerates src/routeTree.gen.ts.
      - name: Build
        run: npm run build

      - name: Check generated route tree
        run: |
          if ! git diff --exit-code -- src/routeTree.gen.ts; then
            echo "::error::src/Web/src/routeTree.gen.ts is out of date. Run npm run build and commit it."
            exit 1
          fi
