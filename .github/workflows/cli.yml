name: CLI

# Builds the forest CLI as one NativeAOT binary per platform (ADR-0008). A pull request that touches the CLI
# builds for Linux x64 only; a tag cli-v<version> builds every platform and publishes a GitHub release.

on:
  pull_request:
    paths:
      - src/Cli/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - .github/workflows/cli.yml
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    name: Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          linux='{"rid":"linux-x64","os":"ubuntu-latest"}'
          if [[ "$GITHUB_REF" == refs/tags/cli-v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "matrix={\"include\":[$linux,{\"rid\":\"linux-arm64\",\"os\":\"ubuntu-24.04-arm\"},{\"rid\":\"osx-arm64\",\"os\":\"macos-latest\"},{\"rid\":\"win-x64\",\"os\":\"windows-latest\"}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.rid }})
    needs: platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The version is the tag without "cli-v"; other builds keep the project's version.
      - name: Publish
        shell: bash
        run: |
          version_args=()
          if [[ "$GITHUB_REF" == refs/tags/cli-v* ]]; then
            version_args=("-p:Version=${GITHUB_REF_NAME#cli-v}")
          fi
          dotnet publish src/Cli -c Release -r ${{ matrix.rid }} -o out "${version_args[@]}"
          ext=""; [[ "${{ matrix.rid }}" == win-* ]] && ext=".exe"
          mkdir dist
          cp "out/forest$ext" "dist/forest-${{ matrix.rid }}$ext"
          "out/forest$ext" --version

      - uses: actions/upload-artifact@v4
        with:
          name: forest-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum forest-* > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "forest ${GITHUB_REF_NAME#cli-v}" --generate-notes
