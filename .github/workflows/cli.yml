name: CLI

# Builds the forest CLI as one NativeAOT binary per platform (ADR-0008). A pull request that touches the CLI
# builds for Linux x64 only; a release (workflow Release calls this one with its tag vX.Y.Z) builds every platform
# and attaches the binaries and SHA256SUMS to the GitHub release that release-please created. The CLI has the
# system's version, from Directory.Build.props. Releases before 0.8.0 were tagged cli-v<version>.

on:
  pull_request:
    paths:
      - src/Cli/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - .github/workflows/cli.yml
  # By hand: every platform; with a tag, the binaries are attached to that existing release (e.g. to redo a failed one).
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to attach the binaries to, e.g. v0.8.0; empty to only build.
        type: string
        required: false
  workflow_call:
    inputs:
      tag:
        description: The release tag, e.g. v0.8.0.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}-${{ inputs.tag || 'branch' }}
  cancel-in-progress: true

jobs:
  platforms:
    name: Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          linux='{"rid":"linux-x64","os":"ubuntu-latest"}'
          if [[ -n "$RELEASE_TAG" || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "matrix={\"include\":[$linux,{\"rid\":\"linux-arm64\",\"os\":\"ubuntu-24.04-arm\"},{\"rid\":\"osx-arm64\",\"os\":\"macos-latest\"},{\"rid\":\"win-x64\",\"os\":\"windows-latest\"}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.rid }})
    needs: platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The version comes from Directory.Build.props, which the release commit has bumped.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Cli -c Release -r ${{ matrix.rid }} -o out
          ext=""; [[ "${{ matrix.rid }}" == win-* ]] && ext=".exe"
          mkdir dist
          cp "out/forest$ext" "dist/forest-${{ matrix.rid }}$ext"
          "out/forest$ext" --version

      - uses: actions/upload-artifact@v4
        with:
          name: forest-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only the CLI's: called from workflow Release, the run also holds the images' build records (*.dockerbuild).
      - uses: actions/download-artifact@v4
        with:
          pattern: forest-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum forest-* > SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
