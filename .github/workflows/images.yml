name: Images

# Builds the four Docker images. Pull requests only check that they build (amd64). Every push to main publishes
# them to GitHub Container Registry as ghcr.io/lepterion/container-forest-<name>, for amd64 and arm64, tagged "main"
# and with the commit's SHA. A release (workflow Release calls this one with its version) tags them X.Y.Z, X.Y and
# "latest": "latest" is always the last release, never an unreleased main. The deploy/ examples pull "latest";
# pin X.Y.Z to stay on one release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The release version, e.g. 0.8.0.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # A release runs on the same ref as the push to main that made it; it must not cancel that build or be cancelled by it.
  group: images-${{ github.ref }}-${{ inputs.version || 'branch' }}
  cancel-in-progress: true

jobs:
  image:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aggregator
            context: .
            file: src/Aggregator/Api/Dockerfile
          - name: agent
            context: .
            file: src/Agent/Dockerfile
          - name: discord-bot
            context: .
            file: src/DiscordBot/Dockerfile
          - name: web
            context: .
            file: src/Web/Dockerfile
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      # arm64 runtime stages (apt-get in the agent's image) run under emulation.
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ghcr.io/lepterion/container-forest-${{ matrix.name }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$GITHUB_SHA"
            if [[ -n "$VERSION" ]]; then
              echo "$IMAGE:$VERSION"
              echo "$IMAGE:${VERSION%.*}"
              echo "$IMAGE:latest"
            else
              echo "$IMAGE:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
