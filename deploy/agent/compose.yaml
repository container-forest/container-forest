# The agent of container-forest, one per host (environment). See docs/installation.md.
#
# Settings come from an .env file next to this one, which is never committed and is readable by root only:
#   CF_DOMAIN=forest.example.com   the aggregator's public name (deploy/aggregator)
#   ENROLLMENT_TOKEN=...           issued by an administrator for this environment; needed for the first start only
#   AGENT_HOSTNAME=web-1           the name the panel shows for this host
services:
  container-forest-agent:
    # "latest" is the last release; pin a version (e.g. :0.8.0) to update only when you choose.
    image: ghcr.io/container-forest/container-forest-agent:latest
    restart: unless-stopped
    # The panel lets users only start this container: stopping the agent would cut the host off.
    labels:
      com.container-forest.system: "true"
    # Without it the panel shows the container's id instead of the host's name.
    hostname: ${AGENT_HOSTNAME:?set AGENT_HOSTNAME in .env}
    environment:
      CF_AGENT__CONTROLLERURL: https://${CF_DOMAIN:?set CF_DOMAIN in .env}
      CF_AGENT__ENROLLMENTTOKEN: ${ENROLLMENT_TOKEN:-}
      # Where the host's root is mounted below: the agent checks bind-mount sources for symbolic links there
      # before deploying a stack under a compose policy (ADR-0012).
      CF_AGENT__HOSTROOT: /host
      # Unmanaged stacks (ADR-0016): compose projects you run by hand, e.g. in /srv/docker, which the panel may then
      # pull, bring up, restart and take down. Uncomment together with the matching volume below.
      # CF_AGENT__UNMANAGEDSTACKROOTS__0: /srv/docker
    # The same paths on the host and in the container: compose runs through the host's daemon,
    # which resolves the stacks' bind mounts on the host. The agent opens no ports.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/container-forest:/opt/container-forest
      - /run/container-forest:/run/container-forest
      # Read-only, and adds nothing: with docker.sock the agent is root on the host anyway. rslave shows disks
      # mounted on the host after the agent started.
      - /:/host:ro,rslave
      # The same path as on the host: compose resolves the projects' relative paths there. Read-only is enough.
      # - /srv/docker:/srv/docker:ro
