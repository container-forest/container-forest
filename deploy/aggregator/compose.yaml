# The aggregator and the panel of container-forest on one host. See docs/architecture.md, "Розгортання ЦА".
#
# Settings come from an .env file next to this one, which is never committed and is readable by root only:
#   CF_DOMAIN=forest.example.com
#       The public name. Caddy gets a Let's Encrypt certificate for it: the name must point to this host,
#       and ports 80 and 443 must reach it. The panel, its API and gRPC for agents and the bot all use it.
#   CF_BOOTSTRAP__ADMINUSERNAME=root
#   CF_BOOTSTRAP__ADMINPASSWORD=...
#       The first administrator (password of at least 12 characters), created on the first start when the
#       database has no users. Remove both lines once you have signed in.
#   CF_BOTGATEWAY__TOKENHASHES__0=...
#       Only with the Discord bot (deploy/discord-bot): SHA-256 of its service token, never the token itself.
# The whole file is passed to the aggregator, so a variable that is not in it stays unset.
services:
  aggregator:
    image: ghcr.io/lepterion/container-forest-aggregator:latest
    restart: unless-stopped
    # Parts of container-forest itself: an agent on this host lets the panel only start them, never stop them.
    labels:
      com.container-forest.system: "true"
    env_file: .env
    environment:
      # Caddy in front sets X-Forwarded-For and X-Forwarded-Proto. The aggregator has no published ports,
      # so every request comes through Caddy and the headers can be trusted.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      # Database, Data Protection key ring and git clones. Back up the whole volume: without the key ring
      # the stored registry credentials cannot be decrypted.
      - aggregator-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/lepterion/container-forest-web:latest
    restart: unless-stopped
    labels:
      com.container-forest.system: "true"
    depends_on:
      - aggregator
    environment:
      CF_SITE_ADDRESS: ${CF_DOMAIN:?set CF_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates and the ACME account: without them every restart asks Let's Encrypt again, which has rate limits.
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  aggregator-data:
  caddy-data:
  caddy-config:
