<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#fff}
  svg{display:block;font-family:Inter,sans-serif}
  .t{font-size:17px;font-weight:600;fill:#0f172a}
  .s{font-size:13px;fill:#475569}
  .m{font-family:'JetBrains Mono',monospace;font-size:12px;fill:#334155}
  .lbl{font-size:12.5px;fill:#1e293b}
  .lblb{font-size:12.5px;fill:#1e293b;font-weight:600}
  .grp{font-size:14px;font-weight:700;letter-spacing:.04em;fill:#64748b;text-transform:uppercase}
  .bg{stroke:#fff;stroke-width:5;paint-order:stroke}
</style></head><body>
<svg id="d" width="1720" height="1080" viewBox="0 0 1720 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>

  <!-- Title -->
  <text x="40" y="44" style="font-size:26px;font-weight:700;fill:#0f172a">container-forest — архітектура</text>
  <text x="40" y="70" class="s">Агенти й бот самі відкривають з'єднання до ЦА; єдиний вхід у систему — Caddy (ADR-0005). Права перевіряє лише ЦА.</text>

  <!-- ============ Clients (top) ============ -->
  <text x="40" y="112" class="grp">Інтерфейси й зовнішні виклики</text>

  <rect x="40" y="124" width="190" height="78" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="135" y="155" text-anchor="middle" class="t">Discord</text>
  <text x="135" y="177" text-anchor="middle" class="s">користувачі, канали</text>

  <rect x="290" y="124" width="220" height="78" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="152" text-anchor="middle" class="t">Discord-бот</text>
  <text x="400" y="172" text-anchor="middle" class="s">.NET, Discord.Net</text>
  <text x="400" y="190" text-anchor="middle" class="m">/dashboard, сповіщення</text>

  <rect x="560" y="124" width="220" height="78" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="670" y="152" text-anchor="middle" class="t">Панель (браузер)</text>
  <text x="670" y="172" text-anchor="middle" class="s">SPA: React, TanStack</text>
  <text x="670" y="190" text-anchor="middle" class="m">cookie cf_session</text>

  <rect x="830" y="124" width="200" height="78" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="930" y="152" text-anchor="middle" class="t">CLI forest</text>
  <text x="930" y="172" text-anchor="middle" class="s">NativeAOT, git-фільтр</text>
  <text x="930" y="190" text-anchor="middle" class="m">Bearer cf_pat_…</text>

  <rect x="1080" y="124" width="250" height="78" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="1205" y="152" text-anchor="middle" class="t">Git-сервер / CI</text>
  <text x="1205" y="172" text-anchor="middle" class="s">push-webhook (HMAC),</text>
  <text x="1205" y="190" text-anchor="middle" class="s">хук деплою (Bearer)</text>

  <!-- ============ Aggregator host ============ -->
  <rect x="40" y="290" width="1080" height="560" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="62" y="318" class="grp">Хост ЦА</text>

  <!-- Caddy -->
  <rect x="70" y="334" width="1020" height="74" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="96" y="364" class="t">Caddy · container-forest-web</text>
  <text x="96" y="386" class="s">deploy/aggregator/compose.yaml · :443, TLS Let's Encrypt · файли панелі · CSP default-src 'self'</text>
  <text x="1064" y="364" text-anchor="end" class="m">/ → SPA    /api, /hubs → :5080</text>
  <text x="1064" y="386" text-anchor="end" class="m">application/grpc → :5081 (h2c)</text>

  <!-- Aggregator -->
  <rect x="70" y="470" width="1020" height="250" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="96" y="500" class="t" style="font-size:19px">Центральний агрегатор (ЦА) · ASP.NET Core, .NET 10</text>

  <rect x="96" y="516" width="300" height="84" rx="8" fill="#fff" stroke="#67e8f9"/>
  <text x="112" y="540" class="lblb">Api · REST + SignalR :5080</text>
  <text x="112" y="560" class="m">/api/*, /hubs/live</text>
  <text x="112" y="578" class="s">Identity, passkeys, Discord OAuth2,</text>
  <text x="112" y="594" class="s">API-токени, вебхуки</text>

  <rect x="412" y="516" width="300" height="84" rx="8" fill="#fff" stroke="#67e8f9"/>
  <text x="428" y="540" class="lblb">gRPC :5081</text>
  <text x="428" y="560" class="m">AgentGateway (agent.proto)</text>
  <text x="428" y="578" class="m">BotGateway (bot.proto)</text>
  <text x="428" y="594" class="s">AgentRegistry, request_id → TCS</text>

  <rect x="728" y="516" width="336" height="84" rx="8" fill="#fff" stroke="#67e8f9"/>
  <text x="744" y="540" class="lblb">Application</text>
  <text x="744" y="560" class="s">AccessPolicy, AuthorizedCommand,</text>
  <text x="744" y="578" class="s">пайплайн деплою, сповіщення,</text>
  <text x="744" y="594" class="s">журнал аудиту</text>

  <rect x="96" y="614" width="968" height="88" rx="8" fill="#fff" stroke="#67e8f9"/>
  <text x="112" y="638" class="lblb">Пайплайн деплою (IDeployStep)</text>
  <g class="m">
    <rect x="112" y="652" width="118" height="34" rx="6" fill="#cffafe"/><text x="171" y="674" text-anchor="middle">GitFetch</text>
    <rect x="250" y="652" width="130" height="34" rx="6" fill="#cffafe"/><text x="315" y="674" text-anchor="middle">SopsDecrypt</text>
    <rect x="400" y="652" width="150" height="34" rx="6" fill="#cffafe"/><text x="475" y="674" text-anchor="middle">ValidateCompose</text>
    <rect x="570" y="652" width="130" height="34" rx="6" fill="#cffafe"/><text x="635" y="674" text-anchor="middle">BuildBundle</text>
    <rect x="720" y="652" width="180" height="34" rx="6" fill="#cffafe"/><text x="810" y="674" text-anchor="middle">ResolveRegistryAuth</text>
    <rect x="920" y="652" width="130" height="34" rx="6" fill="#cffafe"/><text x="985" y="674" text-anchor="middle">SendToAgent</text>
  </g>
  <g stroke="#0891b2" stroke-width="1.5" marker-end="url(#a)">
    <line x1="230" y1="669" x2="248" y2="669"/><line x1="380" y1="669" x2="398" y2="669"/>
    <line x1="550" y1="669" x2="568" y2="669"/><line x1="700" y1="669" x2="718" y2="669"/>
    <line x1="900" y1="669" x2="918" y2="669"/>
  </g>

  <!-- Data volume -->
  <rect x="560" y="752" width="530" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="580" y="778" class="lblb">Том /data (бекапити цілком)</text>
  <text x="580" y="798" class="m">aggregator.db (SQLite, EF Core)</text>
  <text x="580" y="816" class="m">data-protection-keys/ · git-cache/</text>
  <text x="900" y="798" class="s">sops, age-keygen</text>
  <text x="900" y="816" class="s">age-ключі лише тут</text>
  <line x1="825" y1="720" x2="825" y2="750" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- ============ Environments ============ -->
  <text x="1200" y="318" class="grp">Середовища (хости з Docker)</text>

  <g id="envA">
    <rect x="1200" y="334" width="480" height="250" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1222" y="360" class="lblb" style="font-size:15px">Середовище A</text>
    <rect x="1222" y="374" width="200" height="84" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1322" y="400" text-anchor="middle" class="t">Агент</text>
    <text x="1322" y="420" text-anchor="middle" class="s">.NET Worker</text>
    <text x="1322" y="440" text-anchor="middle" class="m">docker compose CLI</text>
    <rect x="1458" y="374" width="200" height="84" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1558" y="406" text-anchor="middle" class="t">Docker Engine</text>
    <text x="1558" y="428" text-anchor="middle" class="s">контейнери стеків</text>
    <line x1="1422" y1="416" x2="1456" y2="416" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="1439" y="474" text-anchor="middle" class="s">Unix socket</text>
    <rect x="1222" y="490" width="436" height="78" rx="8" fill="#fff" stroke="#bbf7d0"/>
    <text x="1238" y="514" class="m">/opt/container-forest/stacks/&lt;stack&gt;</text>
    <text x="1238" y="534" class="m">/run/container-forest (tmpfs, секрети)</text>
    <text x="1238" y="554" class="s">вхідних портів немає</text>
  </g>

  <g>
    <rect x="1200" y="610" width="480" height="150" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1222" y="636" class="lblb" style="font-size:15px">Середовище B, C, …</text>
    <rect x="1222" y="652" width="200" height="84" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1322" y="690" text-anchor="middle" class="t">Агент</text>
    <text x="1322" y="712" text-anchor="middle" class="s">той самий образ</text>
    <rect x="1458" y="652" width="200" height="84" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1558" y="698" text-anchor="middle" class="t">Docker Engine</text>
    <line x1="1422" y1="694" x2="1456" y2="694" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  </g>

  <!-- ============ External (bottom) ============ -->
  <rect x="40" y="930" width="420" height="96" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="250" y="962" text-anchor="middle" class="t">Git-репозиторії</text>
  <text x="250" y="984" text-anchor="middle" class="s">GitHub, Gitea/Forgejo, GitLab</text>
  <text x="250" y="1004" text-anchor="middle" class="s">compose-файли + секрети, зашифровані SOPS</text>

  <rect x="1200" y="930" width="480" height="96" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1440" y="968" text-anchor="middle" class="t">Container registry</text>
  <text x="1440" y="990" text-anchor="middle" class="s">ghcr.io, Docker Hub, приватні</text>

  <!-- ============ Connections ============ -->
  <!-- Discord <-> bot -->
  <line x1="232" y1="163" x2="288" y2="163" stroke="#334155" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="260" y="222" text-anchor="middle" class="lbl bg">Gateway</text>

  <!-- clients -> Caddy -->
  <line x1="400" y1="204" x2="400" y2="332" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="410" y="252" class="lblb bg">gRPC</text>
  <text x="410" y="270" class="lbl bg">x-bot-token + Discord ID</text>

  <line x1="670" y1="204" x2="670" y2="332" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="680" y="252" class="lblb bg">HTTPS REST</text>
  <text x="680" y="270" class="lbl bg">+ SignalR (WebSocket)</text>

  <line x1="930" y1="204" x2="930" y2="332" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="940" y="252" class="lblb bg">HTTPS REST</text>
  <text x="940" y="270" class="lbl bg">API-токен</text>

  <path d="M1205,204 L1205,250 L1080,250 L1080,332" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1215" y="240" class="lbl bg">HTTPS POST</text>

  <!-- Caddy -> aggregator -->
  <line x1="246" y1="410" x2="246" y2="468" stroke="#b45309" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="256" y="446" class="lblb bg" style="fill:#b45309">/api, /hubs</text>
  <text x="256" y="464" class="m bg">h1/h2 → :5080</text>
  <line x1="562" y1="410" x2="562" y2="468" stroke="#b45309" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="572" y="446" class="lblb bg" style="fill:#b45309">gRPC агентів і бота</text>
  <text x="572" y="464" class="m bg">h2c → :5081</text>

  <!-- agents -> Caddy -->
  <path d="M1222,416 L1160,416 L1160,371 L1092,371" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#ag)"/>
  <path d="M1222,694 L1160,694 L1160,416" fill="none" stroke="#15803d" stroke-width="2.2"/>
  <text x="1134" y="232" class="lblb" style="fill:#15803d;display:none"></text>
  <g transform="translate(1146,600) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" class="lblb bg" style="fill:#15803d">gRPC bidi-стрім · ініціює агент</text>
  </g>
  <g transform="translate(1180,600) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" class="m bg">x-agent-id / x-agent-secret</text>
  </g>

  <!-- aggregator -> git -->
  <line x1="250" y1="722" x2="250" y2="928" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="262" y="874" class="lblb bg">git fetch (HTTPS)</text>
  <text x="262" y="892" class="lbl bg">LibGit2Sharp, токен лише на читання</text>
  <text x="262" y="910" class="lbl bg">під префіксом підключення</text>

  <!-- docker -> registry -->
  <line x1="1558" y1="738" x2="1558" y2="928" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M1658,416 L1700,416 L1700,900 L1600,900 L1600,928" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1300" y="800" class="lblb bg">docker pull (HTTPS)</text>
  <text x="1300" y="818" class="lbl bg">тимчасовий DOCKER_CONFIG</text>
  <text x="1300" y="836" class="lbl bg">з кредами від ЦА</text>

  <!-- Legend / invariants -->
  <rect x="560" y="880" width="560" height="146" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="580" y="906" class="lblb">Ключові інваріанти</text>
  <g class="s">
    <text x="580" y="928">• Приватні age-ключі лише на ЦА; агент отримує розшифровані файли</text>
    <text x="580" y="948">• Агент не відкриває портів; environmentId — з автентифікації</text>
    <text x="580" y="968">• Агент виконує лише типізовані команди з agent.proto</text>
    <text x="580" y="988">• Команди до офлайн-агента не ставляться в чергу</text>
    <text x="580" y="1008">• Секрети, паролі й токени — лише хеші або Data Protection</text>
  </g>
</svg>
</body></html>
