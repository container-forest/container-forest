syntax = "proto3";
package agent;
option csharp_namespace = "ContainerForest.Contracts.Agent";

// Agent <-> aggregator protocol. The agent always opens the connection.
//
// Authentication:
// - Enroll is authenticated by the one-time enrollment token in the request.
// - Connect requires call metadata "x-agent-id" and "x-agent-secret" (from EnrollResponse).
//   Invalid credentials end the call with UNAUTHENTICATED.
// - The aggregator derives the environment from these credentials only, never from message content.
//
// "Gateway" already names the role; a "Service" suffix would only lengthen the generated C# types.
// buf:lint:ignore SERVICE_SUFFIX
service AgentGateway {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Bidirectional stream: message types are named by sender, not request/response,
  // because the aggregator's commands travel in the response stream.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}

message EnrollRequest {
  string enrollment_token = 1;
  string hostname = 2;
  string agent_version = 3;
}

// agent_secret is returned once; the aggregator stores only its hash.
message EnrollResponse {
  string agent_id = 1;
  string agent_secret = 2;
}

// Aggregator -> agent. request_id is generated by the aggregator (UUID) and echoed back
// in CommandProgress, LogBatch and the final CommandResult for that request.
// Every command ends with exactly one CommandResult, except CancelRequest, which has none.
message ControllerMessage {
  string request_id = 1;
  // 2-9 are kept for envelope fields shared by all commands (deadline, trace id).
  oneof body {
    ListContainers      list_containers       = 10;
    RestartContainer    restart_container     = 11;
    StopContainer       stop_container        = 12;
    DeployStack         deploy_stack          = 13;
    StartContainer      start_container       = 14;
    RestartStack        restart_stack         = 15;
    DownStack           down_stack            = 16;
    StreamContainerLogs stream_container_logs = 17;
    CancelRequest       cancel_request        = 18;
    RenderStack         render_stack          = 19;
    ListUnmanagedStacks   list_unmanaged_stacks   = 20;
    ControlUnmanagedStack control_unmanaged_stack = 21;
    RemoveContainer       remove_container        = 22;
  }
}

// Agent -> aggregator. Hello must be the first message on every Connect call.
message AgentMessage {
  oneof body {
    Hello           hello           = 1;
    CommandResult   result          = 2;
    ContainerEvent  container_event = 3;
    Heartbeat       heartbeat       = 4;
    CommandProgress progress        = 5;
    LogBatch        log_batch       = 6;
    MetricsSample   metrics         = 7;
  }
}

// boot_id changes after a host reboot; the aggregator then re-sends file secrets (rehydrate).
message Hello {
  string agent_version = 1;
  string docker_version = 2;
  string boot_id = 3;
  repeated ContainerInfo snapshot = 4;
  // How the agent reads resource usage; METRICS_SOURCE_UNSPECIFIED from agents without metrics.
  MetricsSource metrics_source = 5;
  // Seconds between MetricsSample messages; 0 when the agent sends none.
  int32 metrics_interval_seconds = 6;
}

enum MetricsSource {
  METRICS_SOURCE_UNSPECIFIED = 0;
  METRICS_SOURCE_CGROUP_V2 = 1;     // cgroup files of the host, read directly
  METRICS_SOURCE_DOCKER_STATS = 2;  // Docker's stats API (cgroup v1, or the cgroup files are not reachable)
  METRICS_SOURCE_DISABLED = 3;      // turned off in the agent's settings
}

// Sent every 15 seconds.
message Heartbeat {}

// action is the Docker event action ("start", "die", "health_status: healthy", ...).
// container holds the state after the event; it is absent when the container no longer exists.
// exit_code is the code the container's process exited with, from Docker's "die" event; unset for other actions and
// from older agents. Unlike container.status_text it is still there when a restart policy has started the container again.
message ContainerEvent {
  string container_id = 1;
  string action = 2;
  int64 timestamp_unix_ms = 3;
  ContainerInfo container = 4;
  optional int32 exit_code = 5;
}

// stack_name and service_name come from the compose labels and are empty for containers outside compose.
message ContainerInfo {
  string id = 1;
  string name = 2;
  ContainerState state = 3;
  string image = 4;
  string stack_name = 5;
  string service_name = 6;
  string status_text = 7;       // Docker's human-readable status, e.g. "Up 3 minutes (healthy)"
  int64 created_unix_ms = 8;
  // Labelled com.container-forest.system=true: a part of container-forest itself (the aggregator, the panel's
  // Caddy, an agent). The aggregator allows only starting it: stopping it would cut the connection commands use.
  bool system = 9;
}

enum ContainerState {
  CONTAINER_STATE_UNSPECIFIED = 0;
  CONTAINER_STATE_CREATED = 1;
  CONTAINER_STATE_RUNNING = 2;
  CONTAINER_STATE_PAUSED = 3;
  CONTAINER_STATE_RESTARTING = 4;
  CONTAINER_STATE_REMOVING = 5;
  CONTAINER_STATE_EXITED = 6;
  CONTAINER_STATE_DEAD = 7;
}

// One line of `docker compose` output for a running command.
message CommandProgress {
  string request_id = 1;
  string line = 2;
}

// error is absent on success.
message CommandResult {
  string request_id = 1;
  CommandError error = 2;
  // 3-9 are kept for fields shared by all results.
  oneof payload {
    ContainerList containers = 10;
    RenderedStack rendered_stack = 11;
    UnmanagedStackList unmanaged_stacks = 12;
  }
}

message CommandError {
  ErrorCode code = 1;
  string message = 2;
}

message ContainerList {
  repeated ContainerInfo items = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;    // bad stack name, path outside the stack directory, ...
  ERROR_CODE_NOT_FOUND = 2;           // container or stack does not exist
  ERROR_CODE_DOCKER_UNAVAILABLE = 3;  // Docker socket unreachable
  ERROR_CODE_COMMAND_FAILED = 4;      // Docker or compose returned an error
  ERROR_CODE_TIMEOUT = 5;
  ERROR_CODE_CANCELLED = 6;           // ended by CancelRequest
  ERROR_CODE_BUSY = 7;                // another operation on the same stack is running
  ERROR_CODE_INTERNAL = 8;
  ERROR_CODE_UNSUPPORTED = 9;         // this agent version has no handler for the command
}

message ListContainers {}

message StartContainer {
  string container_id = 1;
}

message RestartContainer {
  string container_id = 1;
  int32 timeout_seconds = 2;
}

message StopContainer {
  string container_id = 1;
  int32 timeout_seconds = 2;
}

// docker rm without force and without the container's anonymous volumes: Docker refuses a running container.
message RemoveContainer {
  string container_id = 1;
}

// Covers both redeploy (PULL_POLICY_MISSING) and redeploy with pull (PULL_POLICY_ALWAYS).
// The aggregator rejects bundles above its configured size limit before sending.
// files always contain the stack's compose file as "compose.yaml" at the stack directory root,
// whatever it is called in the repository; the agent passes it to compose with -f compose.yaml,
// so other compose files in the directory (e.g. compose.override.yaml) are not merged in.
message DeployStack {
  string stack_name = 1;
  string commit_sha = 2;
  repeated StackFile files = 3;
  map<string, string> env = 4;
  repeated RegistryAuth registry_auths = 5;
  PullPolicy pull = 6;
  // After compose up, restart the stack's containers when a file other than compose.yaml is new, changed or gone:
  // containers read bind-mounted files such as configuration when they start, and compose recreates a container
  // only when its definition changes. An agent without this field just never restarts.
  bool restart_on_file_change = 7;
  // Pass compose the bundle's .env with --env-file, or an empty file when the bundle has none, as RenderStack does:
  // a .env that something else put into the stack directory must not change what compose interpolates (ADR-0012).
  bool explicit_env_file = 8;
  // Absolute host paths of bind-mount sources. Right before compose up the agent fails the command with
  // ERROR_CODE_COMMAND_FAILED when one of them goes through a symbolic link or cannot be inspected.
  repeated string verify_paths = 9;
}

// Renders the bundle with `docker compose config --format json` in a throwaway directory on tmpfs, with the same files,
// variables and --env-file as DeployStack with explicit_env_file, so the aggregator can check the stack against its
// compose policy before deploying it (ADR-0012). Nothing in the stack directory changes. The result carries
// RenderedStack; an agent without this command answers ERROR_CODE_UNSUPPORTED.
message RenderStack {
  string stack_name = 1;
  repeated StackFile files = 2;
  map<string, string> env = 3;
}

// model_json is compose's normalized model with paths of the throwaway directory turned into the stack directory's,
// and without what may hold secrets and is not needed for the policy: environment, command, entrypoint, healthcheck,
// label values, inline content of secrets and configs, x-* extensions.
message RenderedStack {
  string model_json = 1;
  // Bind-mount sources of the model whose path goes through a symbolic link, or which the agent cannot inspect.
  repeated InspectedPath inspected_paths = 2;
  // The stack's directory on the host, which relative paths of the compose file resolve to.
  string stack_directory = 3;
  // The agent's own directories on the host (its data, all stacks, the secrets tmpfs): no stack may mount them.
  repeated string agent_directories = 4;
}

// link is the first component of path that is a symbolic link; empty when the agent cannot see the path at all
// (unchecked), for example outside its own directories without the host root mounted.
message InspectedPath {
  string path = 1;
  string link = 2;
  bool unchecked = 3;
}

// path is relative to the stack directory. A secret file is written to the tmpfs secrets directory
// (/run/container-forest/<stack_name>/<path>), and the stack directory gets a symbolic link to it at
// <path>, so compose files refer to secrets by ordinary relative paths. Secret content is never logged.
message StackFile {
  string path = 1;
  bytes content = 2;
  uint32 mode = 3;
  bool secret = 4;
}

message RegistryAuth {
  string server = 1;
  string username = 2;
  string password = 3;
}

// Must be set explicitly; the agent rejects PULL_POLICY_UNSPECIFIED with ERROR_CODE_INVALID_ARGUMENT.
enum PullPolicy {
  PULL_POLICY_UNSPECIFIED = 0;
  PULL_POLICY_MISSING = 1;
  PULL_POLICY_ALWAYS = 2;
}

// Stack-level operations on an already deployed stack; they carry no files or env.
// The agent runs `docker compose -p <stack_name> ...` without -f, so compose does not
// read the compose file and needs no env values.
message RestartStack {
  string stack_name = 1;
  int32 timeout_seconds = 2;
}

// Removes the stack's containers and networks. Volumes are kept.
message DownStack {
  string stack_name = 1;
  int32 timeout_seconds = 2;
}

// Streams container logs as LogBatch messages. Without follow the stream ends with a
// successful CommandResult; with follow it runs until CancelRequest or the container stops.
message StreamContainerLogs {
  string container_id = 1;
  int32 tail_lines = 2;       // 0 = all
  bool follow = 3;
  int64 since_unix_ms = 4;    // 0 = no lower bound
}

message LogBatch {
  string request_id = 1;
  repeated LogLine lines = 2;
}

// text is decoded as UTF-8 with invalid bytes replaced.
message LogLine {
  LogStream stream = 1;
  int64 timestamp_unix_ms = 2;
  string text = 3;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

// Asks the agent to stop the running command with target_request_id; that command then
// ends with a CommandResult carrying ERROR_CODE_CANCELLED. Unknown ids are ignored.
message CancelRequest {
  string target_request_id = 1;
}

// Unmanaged stacks (ADR-0016) are compose projects that the host's administrator runs by hand, outside
// container-forest, in the directories the agent is configured to look in (Agent:UnmanagedStackRoots). The agent
// finds them itself: by the compose labels of existing containers and by compose files in those directories. The
// aggregator names a stack only by its project name, never by a path, so it cannot make the agent read compose
// files anywhere else. Stacks the agent deploys itself are never unmanaged. An agent without unmanaged stack roots
// answers with an empty list.
message ListUnmanagedStacks {}

message UnmanagedStackList {
  repeated UnmanagedStack items = 1;
}

// name is the compose project name. directory is the project directory on the host; config_files are the compose
// files compose reads, as absolute host paths. system: one of its containers is labelled com.container-forest.system,
// so the aggregator refuses every operation on it, as for system containers.
// has_containers: the project has containers, running or not; false for a directory with a compose file only.
message UnmanagedStack {
  string name = 1;
  string directory = 2;
  repeated string config_files = 3;
  bool system = 4;
  bool has_containers = 5;
}

// Runs docker compose for an unmanaged stack the agent finds itself (see ListUnmanagedStacks), with the files,
// project directory and env files compose used for it: a stack that is not found is ERROR_CODE_NOT_FOUND.
// Compose output comes as CommandProgress. registry_auths are used for pulling, as in DeployStack.
message ControlUnmanagedStack {
  string stack_name = 1;
  UnmanagedStackOperation operation = 2;
  // For RESTART and DOWN: seconds Docker waits for each container before killing it.
  int32 timeout_seconds = 3;
  repeated RegistryAuth registry_auths = 4;
}

// Must be set; UNMANAGED_STACK_OPERATION_UNSPECIFIED is ERROR_CODE_INVALID_ARGUMENT.
enum UnmanagedStackOperation {
  UNMANAGED_STACK_OPERATION_UNSPECIFIED = 0;
  UNMANAGED_STACK_OPERATION_UP = 1;       // docker compose up -d
  UNMANAGED_STACK_OPERATION_PULL = 2;     // docker compose pull
  UNMANAGED_STACK_OPERATION_RESTART = 3;  // docker compose restart
  UNMANAGED_STACK_OPERATION_DOWN = 4;     // docker compose down; volumes stay
}

// Resource usage, sent by the agent on its own every metrics_interval_seconds (Hello) while the session lives.
// Rates are averages over interval_ms, the time since the previous sample, which the agent computes from Docker's and
// the kernel's cumulative counters; the first sample of a session, and of a container after it (re)started, carries no
// rates for it (has_rates = false). Samples taken while disconnected are lost.
message MetricsSample {
  int64 timestamp_unix_ms = 1;
  int64 interval_ms = 2;
  HostMetrics host = 3;
  repeated ContainerMetrics containers = 4;
  // Filled every 15 minutes or so: reading it is expensive for the Docker daemon. Absent in other samples.
  DockerDiskUsage disk_usage = 5;
}

// Only running containers. stack_name and service_name as in ContainerInfo.
message ContainerMetrics {
  string container_id = 1;
  string name = 2;
  string stack_name = 3;
  string service_name = 4;
  bool has_rates = 5;
  double cpu_cores = 6;                    // 1.5 = one and a half cores busy on average
  double cpu_limit_cores = 7;              // 0 = no limit
  double cpu_throttled_ratio = 8;          // share of the CFS periods in which the container was throttled, 0..1
  uint64 memory_working_set_bytes = 9;     // usage without inactive page cache, what the OOM killer looks at
  uint64 memory_cache_bytes = 10;
  uint64 memory_limit_bytes = 11;          // 0 = no limit
  double network_rx_bytes_per_second = 12;
  double network_tx_bytes_per_second = 13;
  bool host_network = 14;                  // network_mode: host; the network rates are 0, the host's are in HostMetrics
  double block_read_bytes_per_second = 15;
  double block_write_bytes_per_second = 16;
  uint32 pids = 17;
}

// cpu_*_ratio are shares of all cores together (0..1), so cpu_count * ratio is the cores used.
message HostMetrics {
  uint32 cpu_count = 1;
  bool has_rates = 2;
  double cpu_user_ratio = 3;               // user + nice
  double cpu_system_ratio = 4;             // system + irq + softirq
  double cpu_iowait_ratio = 5;
  double cpu_steal_ratio = 6;              // time the hypervisor gave to other guests
  double load1 = 7;
  double load5 = 8;
  double load15 = 9;
  uint64 memory_total_bytes = 10;
  uint64 memory_available_bytes = 11;
  uint64 swap_total_bytes = 12;
  uint64 swap_free_bytes = 13;
  repeated FilesystemMetrics filesystems = 14;
  repeated NetworkInterfaceMetrics interfaces = 15;
  double disk_read_bytes_per_second = 16;  // whole physical disks, partitions are not counted twice
  double disk_write_bytes_per_second = 17;
  int64 uptime_seconds = 18;
}

// A mounted disk file system of the host (no tmpfs, overlay or other virtual ones), one per device.
message FilesystemMetrics {
  string mount_point = 1;                  // as on the host, e.g. "/" or "/var/lib/docker"
  string device = 2;
  string type = 3;
  uint64 total_bytes = 4;
  uint64 available_bytes = 5;              // for unprivileged users, as df shows it
  uint64 used_bytes = 6;
}

// The host's interfaces without lo, veth* and Docker's bridges.
message NetworkInterfaceMetrics {
  string name = 1;
  double rx_bytes_per_second = 2;
  double tx_bytes_per_second = 3;
}

// docker system df. reclaimable_* is what docker image prune -a / builder prune would free.
message DockerDiskUsage {
  uint64 images_bytes = 1;
  uint64 images_reclaimable_bytes = 2;
  uint64 containers_bytes = 3;             // writable layers of all containers
  uint64 volumes_bytes = 4;
  uint64 build_cache_bytes = 5;
  repeated ContainerDiskUsage containers = 6;
  repeated VolumeDiskUsage volumes = 7;
}

message ContainerDiskUsage {
  string container_id = 1;
  string name = 2;
  uint64 writable_layer_bytes = 3;
}

// stack_name: the compose project of a named volume (com.docker.compose.project); empty for other volumes.
message VolumeDiskUsage {
  string name = 1;
  string stack_name = 2;
  uint64 size_bytes = 3;
}
