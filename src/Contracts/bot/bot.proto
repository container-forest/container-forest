syntax = "proto3";
package bot;
option csharp_namespace = "ContainerForest.Contracts.Bot";

// Discord bot -> aggregator protocol. The bot is a client only; it decides nothing itself.
//
// Authentication:
// - Every call carries the bot's service token in the metadata "x-bot-token". The aggregator keeps only
//   its SHA-256 hash, set in its configuration (BotGateway:TokenHashes), never issued by an endpoint.
//   The token is as powerful as an administrator's password: whoever holds it can act as any linked
//   user (security invariant 9).
// - Every request names the Discord user the bot acts for (discord_user_id). The aggregator maps it to the
//   linked user of the system and checks that user's permissions, exactly as for the panel.
//
// Errors are gRPC status codes:
//   UNAUTHENTICATED      the bot token is invalid, or the Discord user is not linked (see "x-cf-reason")
//   PERMISSION_DENIED    the user lacks the role for the action, or is deactivated
//   NOT_FOUND            unknown environment or container, or one the user may not see
//   INVALID_ARGUMENT     malformed request, e.g. a stop timeout out of range
//   FAILED_PRECONDITION  the action makes no sense in the current state, or a container prefix is ambiguous
//   UNAVAILABLE          the environment's agent is offline or disconnected; nothing is queued
//   DEADLINE_EXCEEDED    the agent did not answer in time
//   UNIMPLEMENTED        the agent is too old for the command
//   INTERNAL             the agent reported an error; the status message is readable text for the user
// For UNAUTHENTICATED the trailer "x-cf-reason" is "invalid-bot-token" (a configuration error: log it,
// do not show it) or "account-not-linked" (tell the user to link their Discord account).
// Status messages never contain secrets or exception details and may be shown to the user as they are.
//
// "Gateway" already names the role; a "Service" suffix would only lengthen the generated C# types.
// buf:lint:ignore SERVICE_SUFFIX
service BotGateway {
  // The linked user behind a Discord account. For an unlinked account it answers linked = false
  // instead of UNAUTHENTICATED, so the bot can offer linking without treating it as an error.
  rpc GetCaller(GetCallerRequest) returns (GetCallerResponse);

  // Links the Discord account to the user who issued the one-time code in the panel.
  rpc LinkAccount(LinkAccountRequest) returns (LinkAccountResponse);

  // Environments the user may see, by name.
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);

  // Containers of an environment the user may see, each with whether the user may control it.
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);

  // Starts, stops or restarts a container. Returns once the agent has done it.
  rpc ControlContainer(ControlContainerRequest) returns (ControlContainerResponse);

  // The last lines of a container's log, read once like the panel's log screen; needs the ViewLogs permission.
  // Logs can hold secrets the application printed itself: the bot shows them only to the user who asked.
  rpc GetContainerLogs(GetContainerLogsRequest) returns (GetContainerLogsResponse);

  // Stacks of an environment the user may see, each with what the user may do with it.
  rpc ListStacks(ListStacksRequest) returns (ListStacksResponse);

  // Restarts or takes down a deployed stack. Returns once docker compose has finished. A failed compose run
  // is an answer with error set, not a status, so the bot can show what compose printed.
  rpc ControlStack(ControlStackRequest) returns (ControlStackResponse);

  // Queues a deployment of the stack's latest commit (redeploy, or redeploy with pull), as the panel's "Deploy".
  // Returns at once; follow the deployment with GetDeployment. Not queued when the agent is offline (UNAVAILABLE)
  // or the stack already has one in progress (FAILED_PRECONDITION).
  rpc DeployStack(DeployStackRequest) returns (DeployStackResponse);

  // The state of one deployment of a stack the user may see.
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);

  // Notifications for the bot to post. The bot keeps one call open and reopens it with backoff when it
  // ends; a new call replaces the previous one. Notifications created while no bot was connected are sent
  // when it connects, unless they are older than an hour: those are expired, not delivered late.
  // Not on behalf of a user: notifications go to channels, and administrators choose what goes where.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc WatchNotifications(WatchNotificationsRequest) returns (stream Notification);

  // The outcome of posting one notification. Every received notification gets exactly one report;
  // a notification without a report is sent again on the next WatchNotifications call.
  rpc ReportDelivery(ReportDeliveryRequest) returns (ReportDeliveryResponse);
}

message GetCallerRequest {
  uint64 discord_user_id = 1;
}

message GetCallerResponse {
  bool linked = 1;
  // The fields below are set only when linked is true.
  string user_id = 2;
  string user_name = 3;
  bool is_admin = 4;
  bool is_active = 5;
}

// code comes from the panel (valid for a few minutes, single use). A Discord account links to one user;
// linking it again moves the link. Wrong or expired code: INVALID_ARGUMENT.
message LinkAccountRequest {
  uint64 discord_user_id = 1;
  string discord_user_name = 2;  // shown in the panel next to the link; informational only
  string code = 3;
}

message LinkAccountResponse {
  string user_name = 1;
}

message ListEnvironmentsRequest {
  uint64 discord_user_id = 1;
}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

message Environment {
  string id = 1;  // UUID; pass it back in later requests
  string name = 2;
  bool online = 3;
}

message ListContainersRequest {
  uint64 discord_user_id = 1;
  string environment_id = 2;
}

message ListContainersResponse {
  repeated Container containers = 1;
}

// stack_name and service_name are empty for containers outside compose.
message Container {
  string id = 1;
  string name = 2;
  ContainerState state = 3;
  string image = 4;
  string stack_name = 5;
  string service_name = 6;
  string status_text = 7;  // Docker's human-readable status, e.g. "Up 3 minutes (healthy)"
  bool can_control = 8;    // the user may start, stop and restart it; use it to hide buttons, nothing more
  bool can_remove = 9;     // the user may remove it once it is stopped (Editor); for hiding buttons only
}

// Same values as agent.ContainerState; kept separate so the bot does not depend on the agent protocol.
enum ContainerState {
  CONTAINER_STATE_UNSPECIFIED = 0;
  CONTAINER_STATE_CREATED = 1;
  CONTAINER_STATE_RUNNING = 2;
  CONTAINER_STATE_PAUSED = 3;
  CONTAINER_STATE_RESTARTING = 4;
  CONTAINER_STATE_REMOVING = 5;
  CONTAINER_STATE_EXITED = 6;
  CONTAINER_STATE_DEAD = 7;
}

// container is a full id, an exact name or a unique id prefix, as in the docker CLI.
message ControlContainerRequest {
  uint64 discord_user_id = 1;
  string environment_id = 2;
  string container = 3;
  ContainerAction action = 4;
  // For stop and restart: seconds Docker waits before killing the process, 0 = kill at once.
  // Unset means the aggregator's default.
  optional int32 timeout_seconds = 5;
}

message ControlContainerResponse {}

// Must be set; CONTAINER_ACTION_UNSPECIFIED is INVALID_ARGUMENT.
enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  CONTAINER_ACTION_STOP = 2;
  CONTAINER_ACTION_RESTART = 3;
  // docker rm of a stopped container, volumes stay: Editor. A running one is FAILED_PRECONDITION.
  CONTAINER_ACTION_REMOVE = 4;
}

message GetContainerLogsRequest {
  uint64 discord_user_id = 1;
  string environment_id = 2;
  string container = 3;
  // 1 to 5000; unset means the aggregator's default (200).
  optional int32 tail_lines = 4;
}

// Oldest first.
message GetContainerLogsResponse {
  repeated ContainerLogLine lines = 1;
}

// timestamp_unix_ms is 0 for a line without a time.
message ContainerLogLine {
  int64 timestamp_unix_ms = 1;
  bool stderr = 2;
  string text = 3;
}

message ListStacksRequest {
  uint64 discord_user_id = 1;
  string environment_id = 2;
}

message ListStacksResponse {
  repeated Stack stacks = 1;
}

// can_restart and can_take_down are for hiding buttons, nothing more; the aggregator checks the action itself.
// A system stack (the aggregator's or the agent's own) allows neither: it is updated through a helper container.
message Stack {
  string id = 1;
  string name = 2;  // compose project name; unique in the environment
  bool is_system = 3;
  // Empty / 0 when nothing is deployed: before the first successful deployment and after down.
  string deployed_commit = 4;
  int64 deployed_unix_ms = 5;
  bool can_restart = 6;
  bool can_take_down = 7;
  bool can_deploy = 8;  // redeploy, with or without pull: Editor
  // A compose project the host's administrator runs by hand (ADR-0016): id is empty, can_deploy is false, and
  // ControlStack takes STACK_ACTION_UP and STACK_ACTION_PULL for it. Roles are those on the whole environment.
  // Listed only while the agent is online.
  bool unmanaged = 9;
  bool can_up = 10;    // unmanaged only: docker compose up -d, Editor
  bool can_pull = 11;  // unmanaged only: docker compose pull, Editor
}

// stack is the stack's name in the environment.
// Unknown or invisible stack: NOT_FOUND; a system stack or one with a deployment in progress: FAILED_PRECONDITION;
// a stack the agent has never deployed: NOT_FOUND. A name that is not a managed stack is looked up among the
// environment's unmanaged stacks.
message ControlStackRequest {
  uint64 discord_user_id = 1;
  string environment_id = 2;
  string stack = 3;
  StackAction action = 4;
  // Seconds Docker waits for each container before killing it, 0 = kill at once. Unset means the aggregator's default.
  optional int32 timeout_seconds = 5;
}

// error is empty when compose succeeded. output holds the last lines compose printed; it comes from Docker,
// so escape it before showing it.
message ControlStackResponse {
  string error = 1;
  repeated string output = 2;
}

// Must be set; STACK_ACTION_UNSPECIFIED is INVALID_ARGUMENT.
enum StackAction {
  STACK_ACTION_UNSPECIFIED = 0;
  STACK_ACTION_RESTART = 1;  // docker compose restart: Operator
  STACK_ACTION_DOWN = 2;     // docker compose down, volumes stay: Editor
  STACK_ACTION_UP = 3;       // unmanaged stacks only (FAILED_PRECONDITION for a managed one): docker compose up -d, Editor
  STACK_ACTION_PULL = 4;     // unmanaged stacks only: docker compose pull, Editor
}

// stack is the stack's name in the environment, as for ControlStack.
// Unknown or invisible stack: NOT_FOUND; not Editor: PERMISSION_DENIED; a system stack: FAILED_PRECONDITION.
message DeployStackRequest {
  uint64 discord_user_id = 1;
  string environment_id = 2;
  string stack = 3;
  bool pull = 4;  // pull every image again (redeploy with pull); otherwise only missing ones
}

message DeployStackResponse {
  string deployment_id = 1;  // UUID, for GetDeployment
}

// A deployment that does not exist and one of a stack the user may not see are the same NOT_FOUND.
message GetDeploymentRequest {
  uint64 discord_user_id = 1;
  string deployment_id = 2;
}

// commit is empty until the deployment has fetched it; error is the failure reason, empty otherwise.
message GetDeploymentResponse {
  DeploymentStatus status = 1;
  string commit = 2;
  string error = 3;
  int64 queued_unix_ms = 4;
  int64 finished_unix_ms = 5;  // 0 while unfinished
}

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_QUEUED = 1;
  DEPLOYMENT_STATUS_RUNNING = 2;
  DEPLOYMENT_STATUS_SUCCEEDED = 3;
  DEPLOYMENT_STATUS_FAILED = 4;
  DEPLOYMENT_STATUS_CANCELLED = 5;
}

message WatchNotificationsRequest {}

// summary is the same one-line plain text the panel shows in the notification history; the bot may use
// the structured fields to build a richer message, e.g. a "Restart" button for a container that died.
message Notification {
  string id = 1;
  uint64 discord_channel_id = 2;
  NotificationKind kind = 3;
  NotificationSeverity severity = 4;
  int64 occurred_unix_ms = 5;
  string environment_id = 6;
  string environment_name = 7;
  string summary = 8;
  // 9-19 are kept for fields shared by all kinds.
  // Unset for agent events, which concern the environment as a whole.
  oneof details {
    DeploymentDetails deployment = 20;
    ContainerDetails container = 21;
  }
}

enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NOTIFICATION_KIND_DEPLOYMENT_SUCCEEDED = 1;
  NOTIFICATION_KIND_DEPLOYMENT_FAILED = 2;
  NOTIFICATION_KIND_CONTAINER_DIED = 3;
  NOTIFICATION_KIND_CONTAINER_UNHEALTHY = 4;
  NOTIFICATION_KIND_AGENT_OFFLINE = 5;
  NOTIFICATION_KIND_AGENT_ONLINE = 6;
  // A container that was notified as unhealthy passes its health check again; container details are set.
  NOTIFICATION_KIND_CONTAINER_HEALTHY = 7;
  // Events about the whole system: environment_id is empty and environment_name is "System".
  NOTIFICATION_KIND_BACKUP_FAILED = 8;
  NOTIFICATION_KIND_SETTINGS_CHANGED = 9;
  NOTIFICATION_KIND_ACCOUNT_SECURITY_CHANGED = 10;
  // Image updates of the aggregator (ADR-0015); stack events with stack_id set.
  NOTIFICATION_KIND_IMAGE_UPDATE_FAILED = 11;
  NOTIFICATION_KIND_IMAGE_PINNED = 12;
}

enum NotificationSeverity {
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;
  NOTIFICATION_SEVERITY_INFO = 1;
  NOTIFICATION_SEVERITY_WARNING = 2;
  NOTIFICATION_SEVERITY_ERROR = 3;
}

// error is the deployment's failure reason (empty on success); it never contains secret values.
message DeploymentDetails {
  string deployment_id = 1;
  string stack_id = 2;
  string stack_name = 3;
  string commit_sha = 4;
  bool pulled_images = 5;  // redeploy with pull
  string error = 6;
}

// stack_name and service_name are empty for containers outside compose; exit_code is set for CONTAINER_DIED.
// system: the container may only be started (label com.container-forest.system or a system stack), so the bot offers no restart.
message ContainerDetails {
  string container_id = 1;
  string container_name = 2;
  string stack_name = 3;
  string service_name = 4;
  optional int32 exit_code = 5;
  bool system = 6;
}

// error explains a failed post (e.g. the bot may not write to the channel); it is shown in the panel.
message ReportDeliveryRequest {
  string notification_id = 1;
  bool delivered = 2;
  string error = 3;
}

message ReportDeliveryResponse {}
